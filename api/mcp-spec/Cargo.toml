[package]
name = "cluaizdb-mcp"
version = "0.1.0"
edition = "2021"
description = "Native Model Context Protocol (MCP) server integration for CluaizDB Kernel v2"
license = "MIT OR Apache-2.0"

[dependencies]
cluaizdb-substrate = { path = "../../kernel-core/substrate" }
cluaizdb-group-commit = { path = "../../modules/group-commit" }
cluaizdb-index-mvhsnw = { path = "../../modules/index-engine/mvhsnw-vector" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "sync", "macros", "rt"] }
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
