[package]
name = "cluaizdb-substrate"
version = "0.2.0"
edition = "2021"
description = "Zero-opinion hardware-native B+Tree storage substrate for CluaizDB Kernel v2"
license = "MIT OR Apache-2.0"

[dependencies]
heed = "0.20"
parking_lot = "0.12"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
byteorder = "1.5"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3"
