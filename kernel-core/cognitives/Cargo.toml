[package]
name = "cluaizdb-cognitives"
version = "0.1.0"
edition = "2021"
description = "Cognitive Governance Layer, Genomes, DNA, Topology & Action Interceptor for CluaizDB"
license = "MIT OR Apache-2.0"

[dependencies]
cluaizdb-substrate = { path = "../substrate" }
cluaizdb-wasm-sandbox = { path = "../../runtimes/wasmtime-sandbox" }
wasmtime = "45.0.1"
crossbeam-queue = "0.3"
parking_lot = "0.12"
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
