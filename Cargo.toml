[workspace]
resolver = "2"

members = [
    # Protocol Layer (MCP)
    "api/mcp-spec",

    # Core Execution & Storage Substrate
    "kernel-core/substrate",
    "kernel-core/cognitives",
    "kernel-core/ffi",

    # Pure Standalone Modules
    "modules/group-commit",
    "modules/index-engine/mvhsnw-vector",
    "modules/cdql-query",
    "modules/time-series",

    # Runtimes
    "runtimes/wasmtime-sandbox",

    # Applications & CLI
    "apps/server-http",
    "apps/cli",

    # Hardware Benchmarks
    "tests/benchmarks",
]

# Shared dependency versions for all crates.
# Individual crates inherit these versions from the workspace.
[workspace.dependencies]
# Async runtime
tokio        = { version = "1", features = ["full"] }

# Error handling
thiserror    = "2"
anyhow       = "1"

# Serialization
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

# Zero-copy bytes
bytes        = { version = "1", features = ["serde"] }

# Logging & Tracing
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Unique IDs (UUID v7 - time-sortable)
uuid         = { version = "1", features = ["v7", "serde"] }

# Compression for Tier 3 Cold State
zstd         = "0.13"

# Cryptography & encoding for manifests
sha2         = "0.10"
hex          = "0.4"
futures-util = "0.3"

# Internal crates (version managed here)
cluaizdb-types        = { path = "components/cluaizdb-types" }
cluaizdb-errors       = { path = "components/cluaizdb-errors" }
cluaizdb-common       = { path = "components/cluaizdb-common" }
cluaizd-types         = { package = "cluaizdb-types", path = "components/cluaizdb-types" }
cluaizd-errors        = { package = "cluaizdb-errors", path = "components/cluaizdb-errors" }
cluaizd-common        = { package = "cluaizdb-common", path = "components/cluaizdb-common" }
genome                = { path = "crates/genome" }
heart                 = { path = "crates/heart" }
cluaizdb-index-mvhsnw = { path = "modules/index-engine/mvhsnw-vector" }
cluaizd-index-mvhsnw  = { package = "cluaizdb-index-mvhsnw", path = "modules/index-engine/mvhsnw-vector" }
