[package]
name = "cluaizdb-cli"
version = "0.1.0"
edition = "2021"
description = "High-performance administration CLI for CluaizDB"
license = "MIT OR Apache-2.0"

[[bin]]
name = "cluaizdb"
path = "src/main.rs"

[dependencies]
cluaizdb-substrate = { path = "../../kernel-core/substrate" }
cluaizdb-group-commit = { path = "../../modules/group-commit" }
cluaizdb-index-mvhsnw = { path = "../../modules/index-engine/mvhsnw-vector" }
cluaizdb-mcp = { path = "../../api/mcp-spec" }
cluaizdb-wasm-sandbox = { path = "../../runtimes/wasmtime-sandbox" }
cluaizdb-cdql = { path = "../../modules/cdql-query" }
cluaizdb-server-http = { path = "../server-http" }
axum = "0.7"

tokio = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
